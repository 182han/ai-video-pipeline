<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · Video Studio</title>
<style>
/* 设计令牌与 public/index.html 保持一致（Notion × Apple 混合风） */
:root {
  --bg-primary: #f7f6f3;
  --bg-secondary: #ffffff;
  --text-primary: #37352f;
  --text-secondary: #787774;
  --text-tertiary: #9b9a97;
  --text-placeholder: #c4c4c1;
  --accent: #2383e2;
  --accent-hover: #1a74d1;
  --accent-ring: rgba(35, 131, 226, 0.16);
  --border: #d3d1cb;
  --border-light: #e9e9e7;
  --danger: #e03e3e;
  --danger-bg: #fbecec;
  --shadow-md: 0 4px 12px rgba(15, 15, 15, 0.08);
  --shadow-lg: 0 12px 28px rgba(15, 15, 15, 0.12);
  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", Arial, sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  letter-spacing: -0.01em;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  position: relative;
  overflow: hidden;
}
/* 背景：两团极淡的暖色光斑，避免纯色显得死板 */
body::before,
body::after {
  content: "";
  position: fixed;
  border-radius: 50%;
  filter: blur(60px);
  pointer-events: none;
  z-index: 0;
}
body::before {
  width: 520px; height: 520px;
  background: rgba(35, 131, 226, 0.07);
  top: -180px; left: -140px;
}
body::after {
  width: 460px; height: 460px;
  background: rgba(203, 145, 47, 0.06);
  bottom: -200px; right: -120px;
}

.auth-wrap {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 392px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
}

.auth-card {
  width: 100%;
  background: var(--bg-secondary);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-md), 0 1px 0 rgba(255, 255, 255, 0.8) inset;
  padding: 32px 30px 26px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 26px;
}
.brand-dot {
  width: 22px;
  height: 22px;
  border-radius: 7px;
  background: linear-gradient(135deg, #2383e2 0%, #6ba6e8 100%);
  box-shadow: 0 1px 3px rgba(35, 131, 226, 0.35);
  flex-shrink: 0;
}
.brand-name {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.auth-title {
  font-size: 22px;
  font-weight: 650;
  letter-spacing: -0.02em;
  margin-bottom: 6px;
}
.auth-sub {
  font-size: 13px;
  color: var(--text-secondary);
  margin-bottom: 24px;
}

.field { display: block; margin-bottom: 15px; }
.field-label {
  display: block;
  font-size: 12px;
  font-weight: 550;
  color: var(--text-secondary);
  margin-bottom: 6px;
}
.field input {
  width: 100%;
  height: 38px;
  padding: 0 11px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text-primary);
  background: var(--bg-secondary);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  letter-spacing: 0;
}
.field input::placeholder { color: var(--text-placeholder); }
.field input:hover { background: #fcfcfb; }
.field input:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-ring);
  background: var(--bg-secondary);
}

.auth-error {
  min-height: 18px;
  font-size: 12px;
  line-height: 18px;
  color: var(--danger);
  margin: 2px 0 12px;
  opacity: 0;
  transform: translateY(-2px);
  transition: opacity .16s ease, transform .16s ease;
}
.auth-error.show { opacity: 1; transform: translateY(0); }

.btn {
  width: 100%;
  height: 38px;
  border: none;
  border-radius: var(--radius-sm);
  background: var(--accent);
  color: #fff;
  font-size: 13.5px;
  font-weight: 550;
  font-family: inherit;
  letter-spacing: -0.005em;
  cursor: pointer;
  transition: background .15s ease, transform .06s ease, box-shadow .15s ease;
  box-shadow: 0 1px 2px rgba(35, 131, 226, 0.28);
}
.btn:hover:not(:disabled) { background: var(--accent-hover); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .65; cursor: default; box-shadow: none; }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.auth-foot {
  margin-top: 20px;
  padding-top: 15px;
  border-top: 1px solid var(--border-light);
  font-size: 11.5px;
  line-height: 1.6;
  color: var(--text-tertiary);
}

.auth-copy {
  font-size: 11px;
  color: var(--text-tertiary);
  letter-spacing: 0.01em;
}

/* 错误时的横向抖动，给「密码错了」一个物理反馈 */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-5px); }
  40% { transform: translateX(4px); }
  60% { transform: translateX(-3px); }
  80% { transform: translateX(2px); }
}
.shake { animation: shake .32s ease; }

@media (max-width: 420px) {
  .auth-card { padding: 26px 22px 22px; }
  .auth-title { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<main class="auth-wrap">
  <div class="auth-card" id="card">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Video Studio</span>
    </div>

    <h1 class="auth-title">登录</h1>
    <p class="auth-sub">输入账号与密码以继续</p>

    <form id="loginForm" novalidate>
      <label class="field">
        <span class="field-label">账号</span>
        <input id="username" name="username" type="text" autocomplete="username"
               spellcheck="false" autocapitalize="off" placeholder="请输入账号" required>
      </label>
      <label class="field">
        <span class="field-label">密码</span>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="请输入密码" required>
      </label>

      <div class="auth-error" id="error" role="alert" aria-live="polite"></div>

      <button class="btn" id="submitBtn" type="submit">登录</button>
    </form>

    <div class="auth-foot">
      会话只保存在本次浏览器会话中：关闭浏览器、或服务重启后需要重新登录。
    </div>
  </div>
  <div class="auth-copy">本地部署 · 未登录访问会被拒绝</div>
</main>

<script>
(function () {
  'use strict';

  var form = document.getElementById('loginForm');
  var usernameEl = document.getElementById('username');
  var passwordEl = document.getElementById('password');
  var errorEl = document.getElementById('error');
  var card = document.getElementById('card');
  var submitBtn = document.getElementById('submitBtn');

  // 只接受站内相对路径，避免 ?next=https://evil 这类开放重定向
  var nextRaw = new URLSearchParams(location.search).get('next') || '/';
  var target = /^\/(?!\/)/.test(nextRaw) ? nextRaw : '/';

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('show');
    card.classList.remove('shake');
    // 强制回流，保证连续两次错误都能重放动画
    void card.offsetWidth;
    card.classList.add('shake');
    setTimeout(function () { card.classList.remove('shake'); }, 400);
  }

  function clearError() {
    errorEl.classList.remove('show');
    errorEl.textContent = '';
  }

  function setBusy(busy) {
    submitBtn.disabled = busy;
    submitBtn.textContent = busy ? '登录中…' : '登录';
  }

  // 已经登录过了就直接进去（例如浏览器后退回到登录页）
  fetch('/api/auth/me', { headers: { 'accept': 'application/json' } })
    .then(function (r) { if (r.ok) location.replace(target); })
    .catch(function () {});

  usernameEl.focus();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();

    var username = usernameEl.value.trim();
    var password = passwordEl.value;

    if (!username) { showError('请输入账号'); usernameEl.focus(); return; }
    if (!password) { showError('请输入密码'); passwordEl.focus(); return; }

    setBusy(true);

    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'accept': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          return { status: r.status, body: body };
        });
      })
      .then(function (res) {
        if (res.status === 200) {
          location.replace(target);
          return;
        }
        setBusy(false);
        passwordEl.select();
        if (res.status === 429) {
          showError(res.body.error || '尝试次数过多，请稍后再试');
        } else if (res.status === 503) {
          showError('认证服务不可用，请联系部署者检查数据库连接');
        } else if (res.status === 401) {
          showError(res.body.error || '账号或密码错误');
        } else {
          showError(res.body.error || '登录失败（HTTP ' + res.status + '）');
        }
      })
      .catch(function () {
        setBusy(false);
        showError('无法连接到服务器，请确认服务是否已启动');
      });
  });
})();
</script>
</body>
</html>
