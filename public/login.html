<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>登录 · Video Studio</title>
<!--
  登录页（夜谷 · 白绿主题）
  与改造前相比：只换视觉，认证逻辑逐行一致（同 /api/auth/login、
  next 参数沿用站内相对路径校验、401/429/503 文案照搬）。
  回退：git -C app checkout -- public/login.html
-->
<style>
  :root {
    --text: #0c1a14;
    --text-dim: #46594f;
    --text-tertiary: #6b7d73;
    --placeholder: #8ba096;
    --accent: #0b6b45;
    --accent-hover: #085436;
    --accent-ring: rgba(18, 148, 92, .18);
    --danger: #b3261e;
    --card: rgba(255, 255, 255, .66);
    --card-border: rgba(13, 35, 26, .10);
    --field: rgba(255, 255, 255, .82);
    --field-border: rgba(13, 35, 26, .14);
    --line: rgba(13, 35, 26, .10);
    --radius: 22px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI Variable Display",
            "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--font);
    color: var(--text);
    background: #eef4f1;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -.01em;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  /* 底片：与展示页同一段循环素材 */
  .bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    filter: brightness(1.12) saturate(.60) contrast(.95) hue-rotate(-6deg);
    z-index: 0;
  }
  .veil {
    position: fixed;
    inset: 0;
    z-index: 0;
    background: radial-gradient(120% 90% at 50% 42%,
      rgba(250, 253, 251, .42) 0%, rgba(246, 251, 248, .64) 45%, rgba(240, 247, 243, .80) 100%);
    pointer-events: none;
  }

  .auth-wrap {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 404px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
  }

  .auth-card {
    width: 100%;
    background: var(--card);
    -webkit-backdrop-filter: blur(26px) saturate(150%);
    backdrop-filter: blur(26px) saturate(150%);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow:
      0 30px 70px -30px rgba(18, 44, 33, .40),
      0 2px 8px -4px rgba(18, 44, 33, .14);
    padding: 30px 28px 24px;
    animation: rise .7s cubic-bezier(.2, .7, .2, 1) both;
  }

  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 24px; }
  .brand-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: #c6ff3d;
    box-shadow: 0 0 0 4px rgba(198, 255, 61, .22);
    flex-shrink: 0;
  }
  .brand-name { font-size: 14px; font-weight: 600; }

  .auth-title { font-size: 23px; font-weight: 600; letter-spacing: -.022em; margin-bottom: 6px; }
  .auth-sub { font-size: 14px; color: var(--text-dim); margin-bottom: 22px; }

  .field { display: block; margin-bottom: 14px; }
  .field-label {
    display: block; font-size: 13.5px; font-weight: 550;
    color: var(--text-dim); margin-bottom: 7px;
  }
  .field input {
    width: 100%; height: 44px; padding: 0 13px;
    font-size: 15px; font-family: inherit; color: var(--text);
    background: var(--field);
    border: 1px solid var(--field-border);
    border-radius: 12px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    letter-spacing: 0;
  }
  .field input::placeholder { color: var(--placeholder); }
  .field input:hover { background: rgba(255, 255, 255, .92); }
  .field input:focus {
    border-color: #12945c;
    box-shadow: 0 0 0 4px var(--accent-ring);
    background: #fff;
  }

  .auth-error {
    min-height: 19px; font-size: 13px; line-height: 19px;
    color: var(--danger); margin: 4px 0 12px;
    opacity: 0; transform: translateY(-2px);
    transition: opacity .16s ease, transform .16s ease;
  }
  .auth-error.show { opacity: 1; transform: translateY(0); }

  .btn {
    width: 100%; height: 48px;
    border: none; border-radius: 12px;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; font-family: inherit;
    letter-spacing: .01em; cursor: pointer;
    transition: background .16s ease, transform .06s ease;
  }
  .btn:hover:not(:disabled) { background: var(--accent-hover); }
  .btn:active:not(:disabled) { transform: translateY(1px); }
  .btn:disabled { opacity: .6; cursor: default; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  .auth-foot {
    margin-top: 18px; padding-top: 14px;
    border-top: 1px solid var(--line);
    font-size: 13px; line-height: 1.6; color: var(--text-tertiary);
  }
  .auth-copy { font-size: 12.5px; color: var(--text-dim); letter-spacing: .01em; }


  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(4px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }
  .shake { animation: shake .32s ease; }

  @media (max-width: 420px) {
    .auth-card { padding: 24px 20px 20px; border-radius: 18px; }
    .auth-title { font-size: 21px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .auth-card { animation: none; }
    * { transition: none !important; }
    .shake { animation: none; }
  }
</style>
</head>
<body>

<video class="bg" id="bgVideo" autoplay muted loop playsinline preload="auto"
       poster="showcase/night-valley-poster.jpg" aria-hidden="true" tabindex="-1">
  <source src="showcase/night-valley-loop.mp4" type="video/mp4">
</video>
<div class="veil" aria-hidden="true"></div>
<main class="auth-wrap">
  <div class="auth-card" id="card">
    <div class="brand">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-name">Video Studio</span>
    </div>

    <h1 class="auth-title">登录</h1>
    <p class="auth-sub">输入账号与密码以继续</p>

    <form id="loginForm" novalidate>
      <label class="field">
        <span class="field-label">账号</span>
        <input id="username" name="username" type="text" autocomplete="username"
               spellcheck="false" autocapitalize="off" placeholder="请输入账号" required>
      </label>
      <label class="field">
        <span class="field-label">密码</span>
        <input id="password" name="password" type="password" autocomplete="current-password"
               placeholder="请输入密码" required>
      </label>

      <div class="auth-error" id="error" role="alert" aria-live="polite"></div>

      <button class="btn" id="submitBtn" type="submit">登录</button>
    </form>

    <div class="auth-foot">
      会话只保存在本次浏览器会话中：关闭浏览器、或服务重启后需要重新登录。
    </div>
  </div>
  <div class="auth-copy">本地部署 · 未登录访问会被拒绝</div>
</main>

<script>
(function () {
  'use strict';

  var form = document.getElementById('loginForm');
  var usernameEl = document.getElementById('username');
  var passwordEl = document.getElementById('password');
  var errorEl = document.getElementById('error');
  var card = document.getElementById('card');
  var submitBtn = document.getElementById('submitBtn');

  // 只接受站内相对路径，避免 ?next=https://evil 这类开放重定向（与 login.html 同一规则）
  var nextRaw = new URLSearchParams(location.search).get('next') || '/';
  var target = /^\/(?!\/)/.test(nextRaw) ? nextRaw : '/';

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.classList.add('show');
    card.classList.remove('shake');
    void card.offsetWidth;
    card.classList.add('shake');
    setTimeout(function () { card.classList.remove('shake'); }, 400);
  }

  function clearError() {
    errorEl.classList.remove('show');
    errorEl.textContent = '';
  }

  function setBusy(busy) {
    submitBtn.disabled = busy;
    submitBtn.textContent = busy ? '登录中…' : '登录';
  }

  // 已经登录过了就直接进去（例如浏览器后退回到登录页）
  fetch('/api/auth/me', { headers: { 'accept': 'application/json' } })
    .then(function (r) { if (r.ok) location.replace(target); })
    .catch(function () {});

  usernameEl.focus();

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    clearError();

    var username = usernameEl.value.trim();
    var password = passwordEl.value;

    if (!username) { showError('请输入账号'); usernameEl.focus(); return; }
    if (!password) { showError('请输入密码'); passwordEl.focus(); return; }

    setBusy(true);

    fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'accept': 'application/json' },
      body: JSON.stringify({ username: username, password: password })
    })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (body) {
          return { status: r.status, body: body };
        });
      })
      .then(function (res) {
        if (res.status === 200) {
          location.replace(target);
          return;
        }
        setBusy(false);
        passwordEl.select();
        if (res.status === 429) {
          showError(res.body.error || '尝试次数过多，请稍后再试');
        } else if (res.status === 503) {
          showError('认证服务不可用，请联系部署者检查数据库连接');
        } else if (res.status === 401) {
          showError(res.body.error || '账号或密码错误');
        } else {
          showError(res.body.error || '登录失败（HTTP ' + res.status + '）');
        }
      })
      .catch(function () {
        setBusy(false);
        showError('无法连接到服务器，请确认服务是否已启动');
      });
  });

  // 尊重「减少动态效果」：暂停底片
  var video = document.getElementById('bgVideo');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  function syncMotion() {
    if (!video) return;
    if (reduce.matches) video.pause();
    else { var p = video.play(); if (p && p.catch) p.catch(function () {}); }
  }
  if (reduce.addEventListener) reduce.addEventListener('change', syncMotion);
  syncMotion();
})();
</script>
</body>
</html>
