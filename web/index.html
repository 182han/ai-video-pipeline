<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Studio</title>
<!-- 零 npm 方案：React 与 htm 是预先下载好的 vendor 文件，样式由 tools/tailwind 独立 CLI 生成 -->
<link rel="stylesheet" href="/app/styles/app.css">
<link rel="stylesheet" href="/app/styles/bgm-editor.css">
<link rel="stylesheet" href="/app/styles/adjust-editor.css">
<link rel="stylesheet" href="/app/styles/editor.css">
<link rel="stylesheet" href="/app/styles/assistant-home.css">
<script>
/* 首屏主题：在 React 挂载前先设属性，避免浅色用户看到一帧深色。
   夜间是默认态，只有显式选过 light 才加属性。 */
try { if (localStorage.getItem('vs_theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
</script>
<script src="/app/vendor/react.production.min.js"></script>
<script src="/app/vendor/react-dom.production.min.js"></script>
<script src="/app/vendor/htm.umd.js"></script>
<script type="module" src="/app/src/app.js"></script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
